name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '目标版本 tag；默认仅修补 Android，勾选 full_release 则完整重建该版本草稿；留空完整构建当前 ref'
        required: false
        default: ''
      full_release:
        description: '完整重建目标 tag 的所有平台并在验证通过后公开草稿（不移动 tag）'
        required: false
        type: boolean
        default: false

      reuse_android:
        description: '复用本地构建并上传到草稿的 Android APK（须附源码提交与 SHA256 报告）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一版本只允许一个构建/替换流程，避免资产与校验清单交叉覆盖。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  app:
    # Dispatch the existing workflow on Dev; no workflow/code changes on main.
    if: ${{ github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'app-v') }}
    uses: ./.github/workflows/release-mobile.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit

  preflight:
    # 本地发版先设仓库变量 RELEASE_BUILD_MODE=manual；推 tag 不启动重复构建。
    if: ${{ !startsWith(inputs.tag, 'app-v') && (github.event_name == 'workflow_dispatch' || vars.RELEASE_BUILD_MODE != 'manual') }}
    runs-on: ubuntu-22.04
    steps:
      # 审核策略来自本次 workflow 的固定 SHA；目标旧 tag 不必自带新版脚本。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: 保存当前发版审核脚本
        run: cp scripts/check-release.mjs scripts/apk-layout.mjs "$RUNNER_TEMP/"
      - name: 检出需要审核和构建的目标版本
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验版本与发版脚本
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node "$RUNNER_TEMP/check-release.mjs" --self-test
          node "$RUNNER_TEMP/check-release.mjs" --tag "$RELEASE_TAG"
      - name: 要求固定 Android 签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::缺少 ANDROID_KEYSTORE_B64，禁止临时签名发布"; exit 1; }
          [[ "$CERT_SHA256" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "::error::ANDROID_CERT_SHA256 必须是固定签名证书的 SHA-256（64 位十六进制）"; exit 1; }

      - run: npm ci
        if: ${{ !inputs.tag || inputs.full_release }}
      - name: 验证书源、EPUB、听书和更新回归
        if: ${{ !inputs.tag || inputs.full_release }}
        run: |
          npm run test:book-sources
          npm run test:epub-compat
          npm run test:tts
          npm run test:updater
          if [ -f scripts/test-mobile-updater.mjs ]; then node --experimental-strip-types --test scripts/test-mobile-updater.mjs; fi
      - name: 在构建前准备 Release 草稿
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REPAIR_ANDROID_ONLY: ${{ inputs.tag != '' && !inputs.full_release }}
        run: |
          if [ "$REPAIR_ANDROID_ONLY" = true ]; then
            gh release view "$RELEASE_TAG" >/dev/null
          elif gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-is-draft"; then
            # 完整重跑只续建草稿，避免直接替换已公开版本的部分安装包。
            test "$(cat "$RUNNER_TEMP/release-is-draft")" = true || { echo "::error::该版本已公开，请发布新版本或使用 Android 专项修补"; exit 1; }
          else
            git log -1 --format=%B > "$RUNNER_TEMP/release-notes.txt"
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.txt"
          fi

  desktop:
    needs: preflight
    if: ${{ !inputs.tag || inputs.full_release }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            id: mac-arm64
            args: '--target aarch64-apple-darwin'
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            id: mac-x64
            args: '--target x86_64-apple-darwin'
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest
            id: windows
            # WiX/MSI 在包含多种文件关联时会稳定失败；NSIS 同样是原生安装器且兼容这些关联。
            args: '--bundles nsis'
            rust-targets: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Select audited desktop source
        id: desktop-source
        shell: bash
        run: |
          if [ -f scripts/desktop-release.json ]; then
            cp scripts/{prepare-desktop-release,collect-desktop-release}.mjs "$RUNNER_TEMP/"
            echo "commit=$(node -p "require('./scripts/desktop-release.json').baseCommit")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.desktop-source.outputs.commit != ''
        with:
          ref: ${{ steps.desktop-source.outputs.commit }}
      - uses: actions/setup-node@v4
        if: steps.desktop-source.outputs.commit != ''
        with:
          node-version: 22
      - name: Apply and audit desktop version metadata only
        if: steps.desktop-source.outputs.commit != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node "$RUNNER_TEMP/prepare-desktop-release.mjs"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # sherpa-onnx-sys stores downloaded native libraries beside Cargo's
          # target output, but Rust cache pruning can restore only the build
          # metadata and leave those libraries missing at the final link step.
          cache-targets: false

      - run: npm ci

      - name: 验证桌面拖放与文件夹导入
        run: |
          npm run test:native-drop
          npm run test:folder-pick
          cargo test --locked --manifest-path src-tauri/Cargo.toml library_import

      - name: 验证论文 Agent 前端契约
        run: npm run test:paper-agent

      - name: 验证论文 Agent 原生契约
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml agent

      - name: 验证后台进程无控制台启动与输出管道
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml background_process

      - name: 验证离线语音后台调度与错误传播
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml local_tts::desktop::tests::engine_task

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ${{ github.event.head_commit.message }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Verify native desktop versions and publish build provenance
        if: steps.desktop-source.outputs.commit != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node "$RUNNER_TEMP/collect-desktop-release.mjs" '${{ matrix.id }}' '${{ matrix.rust-targets }}'
          gh release upload "$RELEASE_TAG" desktop-assets/* --clobber

  # Linux 独立并行构建；最终 publish 仍等待全部平台与 Rust 最低版本检查。
  desktop-linux:
    needs: preflight
    if: ${{ !inputs.tag || inputs.full_release }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Select audited desktop source
        id: desktop-source
        shell: bash
        run: |
          if [ -f scripts/desktop-release.json ]; then
            cp scripts/{prepare-desktop-release,collect-desktop-release}.mjs "$RUNNER_TEMP/"
            echo "commit=$(node -p "require('./scripts/desktop-release.json').baseCommit")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.desktop-source.outputs.commit != ''
        with:
          ref: ${{ steps.desktop-source.outputs.commit }}
      - uses: actions/setup-node@v4
        if: steps.desktop-source.outputs.commit != ''
        with:
          node-version: 22
      - name: Apply and audit desktop version metadata only
        if: steps.desktop-source.outputs.commit != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node "$RUNNER_TEMP/prepare-desktop-release.mjs"

      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev cmake rpm

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-targets: false

      - run: npm ci

      - name: 构建并上传到 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: '${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            ${{ github.event.head_commit.message }}
          releaseDraft: true
          prerelease: false

      - name: Verify native desktop versions and publish build provenance
        if: steps.desktop-source.outputs.commit != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node "$RUNNER_TEMP/collect-desktop-release.mjs" 'linux' ''
          gh release upload "$RELEASE_TAG" desktop-assets/* --clobber

  rust-floor:
    needs: preflight
    if: ${{ !inputs.tag || inputs.full_release }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Select audited desktop source
        id: desktop-source
        shell: bash
        run: |
          if [ -f scripts/desktop-release.json ]; then
            cp scripts/{prepare-desktop-release,collect-desktop-release}.mjs "$RUNNER_TEMP/"
            echo "commit=$(node -p "require('./scripts/desktop-release.json').baseCommit")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.desktop-source.outputs.commit != ''
        with:
          ref: ${{ steps.desktop-source.outputs.commit }}
      - uses: actions/setup-node@v4
        if: steps.desktop-source.outputs.commit != ''
        with:
          node-version: 22
      - name: Apply and audit desktop version metadata only
        if: steps.desktop-source.outputs.commit != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node "$RUNNER_TEMP/prepare-desktop-release.mjs"
      - name: 安装 Linux 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libasound2-dev cmake
      - uses: dtolnay/rust-toolchain@1.87.0
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: 检查声明的 Rust 最低版本
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  # Android 仍为实验性 debug 包，但签名/验证失败必须阻止正式发布。
  android:
    needs: preflight
    if: ${{ !inputs.reuse_android }}
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # 审核策略来自本次 workflow 的固定 SHA；目标旧 tag 不必自带新版脚本。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: 保存当前发版审核脚本
        run: cp scripts/check-release.mjs scripts/apk-layout.mjs "$RUNNER_TEMP/"
      - name: 检出需要审核和构建的目标版本
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # v3 默认安装已下架的 `tools` 包, 新版 runner 上会直接失败 (v1.1.17 的 APK 因此缺失)
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: 安装 NDK 与 APK 校验工具
        run: sdkmanager "ndk;26.3.11579264" "build-tools;35.0.0" "platforms;android-36"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: 初始化 Android 工程
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
        run: npx tauri android init

      # `tauri android init` 生成的工程带的是 Tauri 默认图标; `tauri icon` 产出的
      # Android 图标在 src-tauri/icons/android, 需要覆盖进工程, 否则 APK 显示默认图标 (#5)。
      # 桌面名称沿用 productName (LightRead), 手机桌面图标下只显示「轻阅」
      - name: 写入应用图标与名称
        run: |
          RES=src-tauri/gen/android/app/src/main/res
          test -d "$RES"
          cp -r src-tauri/icons/android/. "$RES/"
          ls "$RES"/mipmap-xxxhdpi
          sed -i -E 's|(<string name="(app_name\|main_activity_title)">)[^<]*(</string>)|\1轻阅\3|' "$RES/values/strings.xml"
          grep -q '>轻阅<' "$RES/values/strings.xml"

      # 自定义 MainActivity: 向前端上报系统栏尺寸, 修复旧版 WebView 下内容顶到状态栏 / 被手势条遮挡
      - name: 写入 MainActivity
        run: |
          DST=src-tauri/gen/android/app/src/main/java/com/yzfly/lightread/MainActivity.kt
          test -f "$DST"
          cp src-tauri/android/MainActivity.kt "$DST"
          # 应用内更新: 清单补 REQUEST_INSTALL_PACKAGES, 确认 FileProvider 可共享缓存目录
          # (修补旧 tag 时该版本没有这个脚本, 也没有应用内安装, 跳过)
          if [ -f scripts/patch-android-project.mjs ]; then
            node scripts/patch-android-project.mjs src-tauri/gen/android
            grep -q 'android.permission.REQUEST_INSTALL_PACKAGES' src-tauri/gen/android/app/src/main/AndroidManifest.xml
          fi

      # 固定签名: 每个版本的 APK 签名一致, 手机上才能直接覆盖升级 (保留藏书与进度)。
      # 不允许退回 runner 临时密钥；历史随机签名安装需另行备份/迁移。
      - name: 绑定并预检固定 Android 签名
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          export LIGHTREAD_ANDROID_KEYSTORE="$RUNNER_TEMP/lightread-signing.jks"
          printf 'LIGHTREAD_ANDROID_KEYSTORE=%s\n' "$LIGHTREAD_ANDROID_KEYSTORE" >> "$GITHUB_ENV"
          test -n "$KEYSTORE_B64" || { echo "::error::缺少固定签名密钥"; exit 1; }
          umask 077
          printf %s "$KEYSTORE_B64" | base64 -d > "$LIGHTREAD_ANDROID_KEYSTORE"
          test -s "$LIGHTREAD_ANDROID_KEYSTORE"
          # 对导出的公开证书求 SHA256；不输出 keystore 或 secret 内容。
          keytool -exportcert -alias androiddebugkey -keystore "$LIGHTREAD_ANDROID_KEYSTORE" -storepass android -file "$RUNNER_TEMP/lightread-signing.der" >/dev/null
          ACTUAL_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/lightread-signing.der" | cut -d ' ' -f 1)
          test "$ACTUAL_CERT_SHA256" = "${CERT_SHA256,,}" || { echo "::error::固定 keystore 的证书与 ANDROID_CERT_SHA256 不一致"; exit 1; }
          # 不依赖 HOME/ANDROID_USER_HOME 的默认 debug.keystore 路径。
          # 静态 Kotlin 文本从环境读取绝对路径，避免将路径拼接为 Gradle 代码。
          cat >> src-tauri/gen/android/app/build.gradle.kts <<'KOTLIN'

          // LightRead CI fixed signing
          android {
              signingConfigs.getByName("debug") {
                  storeFile = file(requireNotNull(System.getenv("LIGHTREAD_ANDROID_KEYSTORE")?.takeIf { it.isNotBlank() }) {
                      "LIGHTREAD_ANDROID_KEYSTORE must point to the fixed signing key"
                  })
                  storePassword = "android"
                  keyAlias = "androiddebugkey"
                  keyPassword = "android"
              }
              buildTypes.getByName("debug") {
                  signingConfig = signingConfigs.getByName("debug")
              }
          }
          KOTLIN

      - name: 构建 APK (debug 签名, 可直接安装)
        env:
          NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.3.11579264
          # debug 构建默认带 Rust 调试符号, liblightread_lib.so 会从 ~60MB 涨到 ~240MB
          CARGO_PROFILE_DEV_DEBUG: 0
        run: npx tauri android build --apk --target aarch64 --debug

      - name: 校验 APK 身份、版本、架构、API 与签名
        env:
          AAPT: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0/aapt
          APKSIGNER: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0/apksigner
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          mapfile -t APKS < <(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -type f)
          test "${#APKS[@]}" -eq 1 || { echo "::error::预期恰好一个 arm64 APK，实际 ${#APKS[@]} 个"; exit 1; }
          cp "${APKS[0]}" "LightRead_${RELEASE_TAG}_android_arm64.apk"
          node "$RUNNER_TEMP/check-release.mjs" --tag "$RELEASE_TAG" --apk "LightRead_${RELEASE_TAG}_android_arm64.apk" --cert "$CERT_SHA256"
          sha256sum -c "LightRead_${RELEASE_TAG}_android_arm64.apk.sha256"

      - name: 上传已验证 APK 与校验报告
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # preflight 已统一创建/确认 Release，无需等待桌面构建完成。
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" "LightRead_${RELEASE_TAG}_android_arm64.apk" "LightRead_${RELEASE_TAG}_android_arm64.apk.sha256" "LightRead_${RELEASE_TAG}_android_arm64.apk.json" --clobber

      - name: 清理临时签名文件
        if: ${{ always() }}
        run: rm -f "$LIGHTREAD_ANDROID_KEYSTORE" "$RUNNER_TEMP/lightread-signing.der"

  android-local:
    needs: preflight
    if: ${{ inputs.reuse_android }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: 保存当前审核脚本
        run: cp scripts/check-release.mjs scripts/apk-layout.mjs "$RUNNER_TEMP/"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: build-tools;35.0.0
      - name: 下载并验证本地 APK 的源码、摘要与固定签名
        env:
          AAPT: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0/aapt
          APKSIGNER: ${{ env.ANDROID_SDK_ROOT }}/build-tools/35.0.0/apksigner
          CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: |
          mkdir local-apk
          gh release download "$RELEASE_TAG" --dir local-apk --pattern "LightRead_${RELEASE_TAG}_android_arm64.apk*"
          export LOCAL_APK="local-apk/LightRead_${RELEASE_TAG}_android_arm64.apk"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const apk = process.env.LOCAL_APK;
          const build = JSON.parse(readFileSync(`${apk}.build.json`, 'utf8'));
          const report = JSON.parse(readFileSync(`${apk}.json`, 'utf8'));
          const sha256 = createHash('sha256').update(readFileSync(apk)).digest('hex');
          assert.equal(build.tag, process.env.RELEASE_TAG);
          assert.equal(build.commit, execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim());
          assert.equal(build.sha256, sha256);
          assert.equal(report.sha256, sha256);
          JS
          (cd local-apk && sha256sum -c "LightRead_${RELEASE_TAG}_android_arm64.apk.sha256")
          node "$RUNNER_TEMP/check-release.mjs" --tag "$RELEASE_TAG" --apk "$LOCAL_APK" --cert "$CERT_SHA256"

  publish:
    needs: [desktop, desktop-linux, rust-floor, android, android-local]
    # tag 默认只修补 Android；full_release 必须等待全部平台成功后才能公开草稿。
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.android-local.result == 'success') && ((inputs.tag && !inputs.full_release) || (needs.desktop.result == 'success' && needs.desktop-linux.result == 'success' && needs.rust-floor.result == 'success')) }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      REPAIR_ANDROID_ONLY: ${{ inputs.tag != '' && !inputs.full_release }}
    steps:
      - name: 下载并核对 Release 资产，生成完整 SHA256 清单
        run: |
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets --skip-existing
          cd release-assets
          test -f "LightRead_${RELEASE_TAG}_android_arm64.apk"
          test -f "LightRead_${RELEASE_TAG}_android_arm64.apk.json"
          sha256sum -c "LightRead_${RELEASE_TAG}_android_arm64.apk.sha256"
          if [ "$REPAIR_ANDROID_ONLY" != true ]; then
            compgen -G '*_aarch64.dmg' >/dev/null
            compgen -G '*_x64.dmg' >/dev/null
            compgen -G '*-setup.exe' >/dev/null
            compgen -G '*.AppImage' >/dev/null
            compgen -G '*.deb' >/dev/null
          fi
          if [ "$RELEASE_TAG" = v2.0.0 ] && [ "$REPAIR_ANDROID_ONLY" != true ]; then
            node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = name => createHash('sha256').update(readFileSync(name)).digest('hex');
          for (const id of ['mac-arm64', 'mac-x64', 'windows', 'linux']) {
            const report = JSON.parse(readFileSync(`desktop-${id}.build.json`, 'utf8'));
            assert.equal(report.tag, process.env.RELEASE_TAG);
            assert.equal(report.commit, '1f65e15f447767d01ede13638dcc8d6df4724a0f');
            assert.match(report.nativeVersion, /^2\.0\.0(?:\.0)?$/);
            assert.equal(report.versionPatchSha256, hash('desktop-version.patch'));
            for (const [name, expected] of Object.entries(report.assets)) assert.equal(hash(name), expected, name);
          }
          JS
          fi
          # 不把旧清单包含进新清单，也不删除已上传的安装包。
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release upload "$RELEASE_TAG" SHA256SUMS --clobber
      - name: 全部平台验证完成后公开 Release
        if: ${{ !inputs.tag || inputs.full_release }}
        run: gh release edit "$RELEASE_TAG" --draft=false --title "$RELEASE_TAG" --latest

  # 国内镜像（GitCode）：仅在 publish 成功后运行，只读 GitHub Release；未配置 GITCODE_TOKEN 时内部跳过。
  # 它在 GitHub Release 公开之后才开始，失败不会撤回或修改 GitHub Release，可在
  # Actions → Mirror to GitCode 手动补跑。见 docs/gitcode-mirror.md。
  mirror-gitcode:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
    uses: ./.github/workflows/mirror-gitcode.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit
