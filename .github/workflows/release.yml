name: Release

# This maintenance branch publishes only the final App 1.x release.
# The desktop/full-platform workflow remains unchanged on main.
on:
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write

jobs:
  app:
    uses: ./.github/workflows/release-mobile.yml
    with:
      tag: ${{ inputs.tag }}
    secrets: inherit
