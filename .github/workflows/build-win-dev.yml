name: Build (windows, dev)

# 云端出包：只编译 Windows 桌面版，产出「绿色版 exe」和「NSIS 安装包」。
#   · 手动触发：Actions → Build (windows, dev) → Run workflow
#   · 自动触发：推送到 main（只改文档的提交会跳过）
# 产物两处可取：
#   1) Releases 里固定的开发版页面：https://github.com/gitcool130/LightRead/releases/tag/dev-latest
#   2) 本次运行的 Artifacts（保留 14 天）
# 本机不再编译 exe，也不再构建网页便携版。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要构建的分支 / 提交（留空 = 触发时所在的分支）'
        required: false
        default: ''
      bundles:
        description: '打包方式：nsis 出安装包，none 只要绿色 exe'
        required: false
        default: 'nsis'
        type: choice
        options:
          - nsis
          - none
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '本地改造补丁/**'

permissions:
  contents: write

concurrency:
  group: build-win-dev-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Rust 目标目录很大，不缓存的话每次都要重编十几分钟
      - name: 缓存 Rust 构建
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 装前端依赖
        run: npm ci

      - name: 类型检查与单测
        run: |
          npx vue-tsc -b
          npm run test:pdf-anno

      - name: 编译 Windows 版（绿色 exe + 安装包）
        if: ${{ inputs.bundles != 'none' }}
        run: npm run tauri build -- --bundles nsis

      - name: 编译 Windows 版（只出绿色 exe）
        if: ${{ inputs.bundles == 'none' }}
        run: npm run tauri build -- --no-bundle

      # GitHub 的 Release 资源名只认 ASCII, 中文会被吃掉, 所以:
      #   · 另打一个 zip, 压缩包里的文件名才保留中文（推荐下载）
      #   · exe 用英文名直接挂 Release（Green = 绿色版, Setup = 安装版）
      - name: 收集产物（英文名给 Release，中文名放进 zip）
        id: collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          New-Item -ItemType Directory -Force -Path dist-cn | Out-Null
          $version = (Get-Content src-tauri\tauri.conf.json -Raw | ConvertFrom-Json).version
          Copy-Item src-tauri\target\release\lightread.exe "dist-cn\LightRead-绿色版.exe" -Force
          $nsis = Get-ChildItem src-tauri\target\release\bundle\nsis\*.exe -ErrorAction SilentlyContinue
          if ($nsis) { Copy-Item $nsis.FullName "dist-cn\LightRead-安装版-$version.exe" -Force }
          Compress-Archive -Path dist-cn\*.exe -DestinationPath "out\LightRead-Windows-$version.zip" -Force
          Copy-Item "dist-cn\LightRead-绿色版.exe" "out\LightRead-Green-$version.exe" -Force
          if ($nsis) { Copy-Item "dist-cn\LightRead-安装版-$version.exe" "out\LightRead-Setup-$version.exe" -Force }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Get-ChildItem out | Select-Object Name, Length | Format-Table -AutoSize

      - name: 上传 Artifacts（成品只放这里，不进 Release）
        uses: actions/upload-artifact@v4
        with:
          name: LightRead-Windows
          path: out/*
          if-no-files-found: error
          retention-days: 30

      # 用户要求：dev-latest 只保留源码，不放成品。
      # GitHub 会自动给每个 Release 附上 Source code (zip/tar.gz)，所以这里只要保证没有自定义附件即可。
      - name: 更新开发版 Release（只留源码，清掉所有附件）
        if: ${{ inputs.bundles != 'none' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $sha = (git rev-parse --short HEAD)
          $time = (Get-Date).ToString('yyyy-MM-dd HH:mm')
          $notes = "本页只放源码。成品（绿色版 / 安装版 exe）请到 Actions 里取：`n`n- 打开 Actions → 最近一次成功的 Build (windows, dev) → 页面底部 Artifacts → 下载 LightRead-Windows.zip`n- 里面就是 LightRead-绿色版.exe 和 LightRead-安装版-<版本>.exe`n`n最近一次构建：提交 $sha · $time"
          gh release view dev-latest 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create dev-latest --prerelease --title '开发版（源码）' --notes $notes
          } else {
            gh release edit dev-latest --prerelease --title '开发版（源码）' --notes $notes
          }
          # 把历史遗留的 exe 附件全删掉，只留 GitHub 自动生成的源码包
          $assets = gh release view dev-latest --json assets --jq '.assets[].name'
          foreach ($a in $assets) { gh release delete-asset dev-latest $a --yes 2>$null }
